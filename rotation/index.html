<!-- React runtime is self-hosted (identical UMD bytes to unpkg, SRI-verified) so production
     has no third-party runtime dependency. React 18.3.1 UMD is the final UMD release (React 19
     dropped UMD), so this pin never changes. Babel below is DEV-ONLY: it compiles the .jsx in
     the browser during local authoring; the CI precompile step strips this tag and swaps the
     .jsx for compiled .js in the shipped bundle (see stage-site.js), so it never reaches prod. -->
<script src="react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"></script>
<script src="react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"></script>

<!-- music-core.js = window.ROTATION with everything first paint needs; the deferred rest
     (EXPLORE universe, albums, audio, per-artist clocks) is injected by rotation-app after
     mount via music-rest.js, which merges in and flips ROTATION._restLoaded.
     defer: data no longer blocks the parser/first paint — defer scripts run in document
     order before DOMContentLoaded, so ROTATION is still assembled before the (also
     deferred) app bundles execute. The spotify ♥/engagement overlays are injected
     post-mount by rotation-app (they only decorate artist/track rows). -->
<script src="music-core.js" defer></script>
<script src="live-data.js" defer></script>
<script type="text/babel" src="rotation-live.jsx"></script>

<body>
<div id="root">
  <div id="boot">
    <div class="boot-mark">Rotation<span>.</span></div>
    <div class="boot-sub" id="boot-sub">reading scrobbles…</div>
  </div>
</div>
<script>
  // dynamic count — prefer the daily live total, else the CSV total. Data scripts are defer
  // now, so wait for DOMContentLoaded (defer runs just before it) instead of reading inline.
  document.addEventListener("DOMContentLoaded", function () { try {
    var t = (window.ROTATION_LIVE && window.ROTATION_LIVE.total) || (window.ROTATION && window.ROTATION.TOTALS && window.ROTATION.TOTALS.scrobbles) || 0;
    if (t) document.getElementById("boot-sub").textContent = "reading " + Math.round(t / 1000) + "k scrobbles…";
  } catch (e) {} });
</script>
<style>
  #boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    font-family: 'Source Serif 4', Georgia, serif; background: #0b0a0f; }
  .boot-mark { font-style: italic; font-weight: 600; font-size: 44px; letter-spacing: -.02em; color: #f1eef6; }
  .boot-mark span { font-style: normal; color: oklch(0.74 0.13 330); }
  .boot-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
    color: #665f78; animation: bootpulse 1.6s ease-in-out infinite; }
  @keyframes bootpulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
</style>
<script>
  // PWA shell — https only, so local dev (http) never registers a worker
  if ("serviceWorker" in navigator && location.protocol === "https:")
    addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(swWarm).catch(() => {}));

  // Per-VIEW route shards — the files each top-level tab injects the first time it is opened.
  // Warming them is what makes a tab you never opened this epoch work offline; the worker skips
  // whatever this epoch already holds, so a repeat run costs nothing. ~9.0 MB gzip over the wire
  // / ~24.6 MB decompressed on device, once per cache epoch. Per-ARTIST data (artist-flow /
  // artist-detail, about/* buckets, mb-* / genius-* stores) is deliberately absent — that stays
  // cache-on-use, and llm-about.js is over the worker's 5 MB cache guard anyway.
  const SW_PRIME = [
    "media-index.js", "track-audio.js", "track-previews.js", "preview-fallback.js",       // shared: Records/Explore/Time/Liked/album+track
    "calendar.js", "calendar-detail.js", "day-hours.js", "day-series.js",                 // Time + Overview
    "world-map.js",                                                                       // Overview map
    "filter-index.js",                                                                    // Explore theme/decade chips
    "shelves-unplayed.js", "mb-album-labels.js", "label-parents.js",                      // Records
    "search-index.js",                                                                    // header search overlay (every page)
    "reading.js",                                                                         // Stories
    "tm-tour-lazy.js",                                                                    // Gigs / Live
    "liked-meta.js", "spotify-liked.js", "spotify-engagement.js",                         // Liked
    "spotify-insights.js", "spotify-persona.js", "spotify-attention.js",                  // Spotify (#spotify)
    "artist-x.js",                                                                        // artist page + map band (split off music-rest, audit 2026-09-22 B1)
    "album-extras.js", "album-about-lazy.js", "album-absorb.js", "instrumentals.js",      // album + track pages
    "words-layer.js", "vendor-page-flip.js",                                              // portrait prose · Book page-flip
  ];

  function swWarm() {
    // Best-effort: ask the browser not to evict Cache Storage under general storage pressure.
    // Fire-and-forget — private windows reject it, some engines ignore it; never block, never throw.
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}

    const idle = window.requestIdleCallback ? window.requestIdleCallback.bind(window) : ((f) => setTimeout(f, 2500));
    idle(() => {
      navigator.serviceWorker.ready.then((reg) => {
        const w = reg && reg.active;
        if (!w) return;
        // 1 · EPOCH CARRY-FORWARD. Hand the worker the ?v=-stamped URLs this document is actually
        // running on. They are content-addressed, so it can lift those entries out of the previous
        // epoch's cache instead of letting the next visit re-download byte-identical bundles after
        // every daily deploy — then it drops that epoch, so at most one ever lingers.
        try {
          const assets = [];
          document.querySelectorAll("script[src], link[href]").forEach((n) => {
            const raw = n.getAttribute("src") || n.getAttribute("href");
            if (!raw) return;
            const u = new URL(raw, location.href);
            if (u.origin === location.origin && /[?&]v=/.test(u.search)) assets.push(u.href);
          });
          // music-rest.js is injected after mount, so it may not be in the DOM yet; its ?v= is a
          // content hash of the file itself (ROTATION.REST_V), so name it outright.
          const R = window.ROTATION;
          if (R && R.REST_V) assets.push(new URL("music-rest.js?v=" + R.REST_V, location.href).href);
          w.postMessage({ type: "EPOCH_HANDOFF", assets });
        } catch (e) {}
        // 2 · ROUTE-SHARD WARM-UP. Skipped on a first-ever visit (no controller — everything is
        // being downloaded for the first time anyway) and whenever Data Saver is on. The worker
        // fetches these itself: the load right after a deploy is still controlled by the OUTGOING
        // worker, so a fetch() from here would land in the cache that is about to be dropped.
        try {
          if (!navigator.serviceWorker.controller) return;
          if (navigator.connection && navigator.connection.saveData) return;
          w.postMessage({ type: "PRIME", assets: SW_PRIME });
        } catch (e) {}
      }).catch(() => {});
    }, { timeout: 5000 });
  }
</script>
