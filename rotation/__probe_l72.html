<!doctype html><meta charset="utf-8">
<style>body{margin:0;font:11px/1.5 monospace;background:#fff;color:#000;white-space:pre-wrap}
iframe{position:fixed;left:-9999px;top:0;border:0}</style>
<body>
<iframe id="f" src="index.html#overview"></iframe>
<div id="out" style="position:fixed;right:0;top:0;width:280px;background:#ffe;z-index:9">waiting</div>
<script>
// ?w= iframe width, ?h= iframe height, ?show=<selector> scroll there + bring on-screen
const Q = new URLSearchParams(location.search);
const W = +(Q.get("w") || 360), H = +(Q.get("h") || 780);
const fr = document.getElementById("f"); fr.style.width = W + "px"; fr.style.height = H + "px";
const out = document.getElementById("out");
function scan() {
  try {
    const doc = fr.contentDocument, win = fr.contentWindow;
    const grid = doc.querySelector(".ov-insgrid");
    if (!grid || !grid.querySelector(".r-card")) { out.textContent = "insgrid not mounted yet"; return setTimeout(scan, 1000); }
    const labels = [...grid.querySelectorAll(".r-card .lbl")].map(e => e.textContent.trim());
    out.textContent = "cards=" + labels.length + " :: " + labels.join(" | ");
    document.title = "GRID " + labels.join("|");
    const show = Q.get("show");
    if (show) {
      const el = doc.querySelector(show);
      if (el) win.scrollTo(0, el.getBoundingClientRect().top + win.scrollY - 60);
      fr.style.left = "0"; out.style.display = "none";
    }
  } catch (e) { out.textContent = "ERR " + e.message; setTimeout(scan, 1000); }
}
setTimeout(scan, 12000);
</script>
