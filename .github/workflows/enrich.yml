name: Weekly enrichment refresh

# Keeps the metadata caches from rotting: new artists that entered the library since the last
# run get last.fm tags/stats/bios + MusicBrainz origins/aliases automatically. Every script is
# incremental (cached artists are skipped), so a normal week costs a handful of API calls.
# Dataset-based enrichment (per-track audio features, album art) stays local -- it needs the
# large local catalogue dataset. Discogs is also left local (token + ambiguity pins live there).

on:
  schedule:
    - cron: "40 7 * * 1"   # Mondays ~07:40 UTC, after the daily sync
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rotation-enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    # Rotation lives in rotation/; run every script (and the git add of its caches) from there.
    defaults:
      run:
        working-directory: rotation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # generated files (search-index.js -- the enrichers' artist list) are not in git;
      # rebuild them from the committed CSV first
      - name: Build dataset (generates search-index.js)
        run: node build-data.js

      - name: last.fm tags (new artists only)
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: node enrich-tags.js 10000

      - name: last.fm global stats
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: node enrich-stats.js 10000

      # 3000 -> 6000 (Fuad 2026-08-16): the 3000-cap seam is exactly where Fu Manchu
      # (rank ~1761 in some index orderings, absent in others) fell through for months —
      # all caps now match at 10000 (raised from 6000, Fuad 2026-08-26 - background hum toward the long tail) so no layer has a private cutoff.
      - name: last.fm bios + similar
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: node enrich-bios.js 10000

      - name: last.fm per-album tags
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: node enrich-album-tags.js

      # --refresh=200: also refetch the 200 oldest-fetched entries so life-status changes
      # (reactivations, disbandments, deaths — the `ended`/`end` flags this cache OWNS) reach
      # the frozen cache. ~5.5k entries / 200 per week â‰ˆ full cycle ~6 months; ended + top-500
      # artists ride a priority lane so they come back around much faster than the long tail.
      - name: MusicBrainz origins (gender / life-span)
        run: node enrich-origins.js 10000 --refresh=200

      - name: MusicBrainz aliases
        run: node enrich-aliases.js 10000

      # keyless, 1 req/s, incremental — first run works off a large backlog and may take
      # a couple of hours; every later week is new-artists-only.
      # --refresh=200: also refetch the 200 oldest-fetched entries so life-status changes
      # (reactivations, disbandments, deaths, new releases) reach the frozen cache.
      # ~4.9k entries / 200 per week â‰ˆ full cycle ~6 months; ended + top-500 artists ride a
      # priority lane so they come back around much faster than the long tail.
      - name: MusicBrainz deep pull (release-groups + relations)
        run: node enrich-mb.js 10000 --refresh=200

      # --refresh=150 (~4 batches of 40): same rolling cycle for the Wikidata cache; ended/
      # top-500 first, no-entity (null) rows refreshed last.
      - name: Wikidata (formation city, members, coords) — keyless SPARQL
        run: node enrich-wikidata.js 2500 --refresh=150

      # keyless, 1 req/s, incremental — band â†’ member lineups (instrument/vocal attributes +
      # member genders) from MusicBrainz artist-rels, for the VOCALS filter's ~3,800 bands whose
      # wikidata carried no lineup. 1500-cap keeps the cron sane (bands + shared member sub-fetches
      # at 1 req/s); it chips away incrementally, most-played-first. Member genders are cached and
      # deduped across bands, so later weeks cost mostly the new distinct members.
      - name: MusicBrainz band members (VOCALS fallback lineups)
        run: node enrich-members.js 1500

      # keyless Deezer photos — last-resort artist images for the long tail Discogs/Spotify never
      # reached (ANIMISERY-class). Strict name-match gate; 500/run so the cron stays fast (incremental).
      - name: Deezer artist images (placeholder fallback)
        run: node enrich-deezer-img.js 500

      # NB: Ticketmaster is NOT here on purpose — tour.yml already does the settled
      # location-first pull (markets + radius, lineups intersected with the library)
      # every Monday with the TICKETMASTER_API secret. Don't duplicate it.
      - name: Coverage report (gaps by play-band, to the Actions log)
        run: node enrich-coverage.js || true

      - name: Commit refreshed caches
        run: |
          git config user.name "rotation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tag-cache.json artist-stats.json artist-bios.json artist-origins.json artist-aliases.json \
                  artist-mb.json artist-members.json wikidata-cache.json album-genres.json deezer-artist-img.json
          git add concerts-cache.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "caches already fresh"
          else
            git commit -m "chore: weekly enrichment refresh (new artists)"
            git push || (git pull --rebase --autostash && git push)
          fi
