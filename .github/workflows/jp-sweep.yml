# Weekly Japan concert sweep — no LLM, no secrets. Scrapes Songkick's Japan metros, the
# international promoters (Creativeman, SMASH, Udo, Live Nation HIP) and the Tokyo
# livehouse calendars, matches everything against the library and appends new shows to
# rotation/data/concerts-tokyo.json (marks untouched), then refreshes the discovery
# shelf. The commit triggers sync.yml, which rebuilds the site and the gigs.ics feed.
# A source whose parser rots shows up as FAILED/0 in the run log and commit message.
name: Japan gigs sweep
on:
  schedule:
    - cron: "23 6 * * 4"    # Thursdays 15:23 JST (cron is UTC)
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write            # to dispatch sync.yml — GITHUB_TOKEN pushes don't trigger it
concurrency:
  group: gig-data-commit    # serialize against gig-marks commits
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 35   # udo opens ~180 show pages and toos ~100 calendar days, sequentially
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Sweep, match, merge, discover
        run: |
          set -o pipefail
          python3 rotation/scripts/sweep_listings.py --data rotation --out rotation/data | tee run.log
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "gig-sweep" && git config user.email "actions@users.noreply.github.com"
          # prune sweep archives older than ~90 days BY FILENAME DATE (checkout resets
          # mtimes, so find -mtime would never fire in CI); discover only scores FUTURE
          # events, so old files are dead weight in the working tree
          CUT=$(date -d '90 days ago' +%F)
          for f in rotation/data/listings-sweep-*.json; do
            d=$(basename "$f" .json); d=${d#listings-sweep-}
            [ -e "$f" ] && [[ "$d" < "$CUT" ]] && rm -v "$f"
          done || true
          git add -A rotation/data/
          SUMMARY=$(grep -m1 '^sweep:' run.log | cut -c1-400 || echo "sweep")
          MERGED=$(grep -m1 'new rows' run.log || true)
          if git commit -m "Japan gigs sweep: ${MERGED:-no new rows}" -m "$SUMMARY"; then
            git pull --rebase origin main    # a concurrent commit may have advanced main
            git push origin main
            gh workflow run sync.yml --ref main
          else
            echo "nothing to commit"
          fi
